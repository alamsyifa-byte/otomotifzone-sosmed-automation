<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OtomotifZone Feed Template Prototype</title>
  <style>
    @font-face{font-family:MontserratOZ;src:url('assets/montserrat.black.otf') format('opentype');font-weight:900;font-display:swap}
    @font-face{font-family:MontserratOZ;src:url('assets/montserrat.medium.otf') format('opentype');font-weight:500;font-display:swap}
    *{box-sizing:border-box}
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2f7;background:#0d1117}
    body{margin:0;padding:28px;background:radial-gradient(circle at top,#202938,#0d1117 52%)}
    .app{max-width:1420px;margin:auto;display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr);gap:28px;align-items:start}
    .panel{background:#151b24;border:1px solid #2b3545;border-radius:18px;padding:22px;box-shadow:0 18px 60px #0007;position:sticky;top:20px}
    h1{font-size:22px;margin:0 0 6px}.intro{color:#9eacc0;font-size:14px;margin:0 0 20px;line-height:1.5}
    label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:#bdc7d6;margin:15px 0 7px;text-transform:uppercase}
    textarea,input[type=text],input[type=file]{width:100%;border:1px solid #344155;border-radius:10px;background:#0c1119;color:#fff;padding:11px 12px;font:inherit}
    textarea{resize:vertical;min-height:72px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.range-row{display:grid;grid-template-columns:1fr 42px;align-items:center;gap:10px}
    input[type=range]{width:100%;accent-color:#d80101}.value{font-variant-numeric:tabular-nums;text-align:right;color:#fff}
    button{width:100%;border:0;border-radius:11px;padding:13px 16px;margin-top:18px;background:#d80101;color:white;font-weight:800;font-size:15px;cursor:pointer}
    button:hover{background:#ee1010}.secondary{background:#283344}.secondary:hover{background:#34435a}
    .status{margin-top:14px;border-radius:10px;padding:10px 12px;background:#202938;color:#b9c5d5;font-size:13px;line-height:1.45}.status.warn{background:#46291a;color:#ffd5aa}
    .stage{min-width:0;display:flex;justify-content:center;align-items:flex-start}.poster-shell{width:min(100%,648px);aspect-ratio:3/4;position:relative;overflow:hidden;box-shadow:0 24px 80px #000b;background:#111}
    .poster{position:absolute;width:1080px;height:1440px;transform-origin:top left;overflow:hidden;background:#ddd}
    .photo-wrap{position:absolute;inset:0 0 auto 0;overflow:hidden;background:#777}.photo{width:100%;height:100%;display:block;object-fit:cover}
    .logo-top{position:absolute;left:50px;top:48px;width:253px;height:35px;object-fit:contain}
    .category{position:absolute;right:0;top:61px;max-width:320px;max-height:70px;object-fit:contain;object-position:right top}
    .red-box{position:absolute;left:0;right:0;bottom:0;background:#d80101;color:#fff;text-align:center}
    .headline{position:absolute;left:48px;right:48px;margin:0;font-family:MontserratOZ,Montserrat,sans-serif;font-weight:900;line-height:1.04;text-transform:uppercase;white-space:normal}
    .subheadline{position:absolute;left:70px;right:70px;margin:0;font-family:MontserratOZ,Montserrat,sans-serif;font-weight:500;line-height:1.22;white-space:normal}
    .logo-bottom{position:absolute;left:50px;bottom:27px;width:77px;height:87px;object-fit:contain}
    .author{position:absolute;right:48px;bottom:31px;max-width:320px;max-height:60px;object-fit:contain;object-position:right bottom}
    .spec{max-width:648px;margin:14px auto 0;color:#9eacc0;font-size:12px;text-align:center}
    @media(max-width:900px){body{padding:14px}.app{grid-template-columns:1fr}.panel{position:static}.stage{grid-row:1}.poster-shell{max-height:70vh;width:auto;height:min(70vh,720px)}}
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>OZ Feed Template — Prototype</h1>
      <p class="intro">Berjalan lokal tanpa VPS. Semua pemrosesan terjadi di browser dan hasil ekspor tetap 1080 × 1440 px.</p>

      <label for="headlineInput">Headline (maks. 2 baris)</label>
      <textarea id="headlineInput">PERTAMAX DRAG FEST 2026 HIBUR PENGUNJUNG SEPANJANG EVENT</textarea>

      <label for="subInput">Sub-headline (maks. 2 baris)</label>
      <textarea id="subInput">Pengunjung Pertamax Drag Fest 2026 bisa menjajal simulator MotoGP dan Lamborghini dengan layout Sirkuit Mandalika</textarea>

      <label for="photoInput">Ganti foto berita</label>
      <input id="photoInput" type="file" accept="image/*">

      <div class="row">
        <div><label for="focusX">Fokus horizontal</label><div class="range-row"><input id="focusX" type="range" min="0" max="100" value="50"><span class="value" id="focusXValue">50</span></div></div>
        <div><label for="focusY">Fokus vertikal</label><div class="range-row"><input id="focusY" type="range" min="0" max="100" value="50"><span class="value" id="focusYValue">50</span></div></div>
      </div>

      <div class="row">
        <div><label for="categoryInput">PNG kategori</label><input id="categoryInput" type="file" accept="image/png"></div>
        <div><label for="authorInput">PNG author</label><input id="authorInput" type="file" accept="image/png"></div>
      </div>

      <button id="downloadButton">Ekspor PNG 1080 × 1440</button>
      <button id="resetButton" class="secondary">Kembalikan contoh awal</button>
      <div id="status" class="status">Font dan layout sedang disiapkan…</div>
    </section>

    <section>
      <div class="stage">
        <div class="poster-shell" id="posterShell">
          <article class="poster" id="poster">
            <div class="photo-wrap" id="photoWrap"><img class="photo" id="photo" src="assets/sample-photo.png" alt="Foto berita"></div>
            <img class="logo-top" id="logoTop" src="assets/logo-top.png" alt="OtomotifZone">
            <img class="category" id="category" src="assets/category.png" alt="Kategori">
            <section class="red-box" id="redBox">
              <div class="headline" id="headline"></div>
              <div class="subheadline" id="subheadline"></div>
              <img class="logo-bottom" id="logoBottom" src="assets/logo-bottom.png" alt="OtomotifZone">
              <img class="author" id="author" src="assets/author.png" alt="Author">
            </section>
          </article>
        </div>
      </div>
      <div class="spec" id="spec"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const defaults = {
      headline:'PERTAMAX DRAG FEST 2026 HIBUR PENGUNJUNG SEPANJANG EVENT',
      sub:'Pengunjung Pertamax Drag Fest 2026 bisa menjajal simulator MotoGP dan Lamborghini dengan layout Sirkuit Mandalika',
      photo:'assets/sample-photo.png', category:'assets/category.png', author:'assets/author.png'
    };
    const state = {headlineSize:72,subSize:36,headlineLines:[],subLines:[],redHeight:377,focusX:50,focusY:50,truncated:false};
    const measure = document.createElement('canvas').getContext('2d');

    function wrapText(text,maxWidth,size,weight){
      measure.font = `${weight} ${size}px MontserratOZ, Montserrat, sans-serif`;
      const words=text.trim().replace(/\s+/g,' ').split(' ').filter(Boolean), lines=[]; let line='';
      for(const word of words){const test=line?line+' '+word:word;if(!line||measure.measureText(test).width<=maxWidth)line=test;else{lines.push(line);line=word}}
      if(line)lines.push(line); return lines.length?lines:[''];
    }
    function ellipsize(line,maxWidth,size,weight){
      measure.font=`${weight} ${size}px MontserratOZ, Montserrat, sans-serif`; let out=line;
      while(out.length&&measure.measureText(out+'…').width>maxWidth)out=out.slice(0,-1).trimEnd(); return out+'…';
    }
    function fit(text,maxWidth,maxSize,minSize,weight){
      for(let size=maxSize;size>=minSize;size--){const lines=wrapText(text,maxWidth,size,weight);if(lines.length<=2)return {size,lines,truncated:false}}
      const all=wrapText(text,maxWidth,minSize,weight);return {size:minSize,lines:[all[0],ellipsize(all.slice(1).join(' '),maxWidth,minSize,weight)],truncated:true};
    }
    function render(){
      const h=fit($('headlineInput').value,984,72,50,900); state.headlineSize=h.size;state.headlineLines=h.lines;state.truncated=h.truncated;
      const idealSub=Math.max(30,Math.min(40,Math.round(h.size/2))); const s=fit($('subInput').value,940,idealSub,30,500);state.subSize=s.size;state.subLines=s.lines;state.truncated=h.truncated||s.truncated;
      const headlineHeight=h.lines.length*h.size*1.04, subHeight=s.lines.length*s.size*1.22;
      state.redHeight=Math.max(340,Math.min(480,Math.ceil(28+headlineHeight+16+subHeight+25+87+27)));
      const redTop=1440-state.redHeight;
      $('photoWrap').style.height=redTop+'px';$('photo').style.objectPosition=`${state.focusX}% ${state.focusY}%`;
      $('redBox').style.height=state.redHeight+'px';
      $('headline').style.top='28px';$('headline').style.fontSize=h.size+'px';$('headline').innerHTML=h.lines.map(escapeHtml).join('<br>');
      $('subheadline').style.top=(28+headlineHeight+16)+'px';$('subheadline').style.fontSize=s.size+'px';$('subheadline').innerHTML=s.lines.map(escapeHtml).join('<br>');
      $('focusXValue').textContent=state.focusX;$('focusYValue').textContent=state.focusY;
      $('spec').textContent=`Headline ${h.size}px/${h.lines.length} baris · Sub-headline ${s.size}px/${s.lines.length} baris · Box merah ${state.redHeight}px · Area foto ${redTop}px`;
      $('status').className='status'+(state.truncated?' warn':'');$('status').textContent=state.truncated?'Teks terlalu panjang pada ukuran minimum dan dipotong dengan “…”. Ringkas teks sebelum produksi.':'Layout valid: headline dan sub-headline masing-masing maksimal dua baris.';
    }
    function escapeHtml(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function useUpload(input,img){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{img.src=reader.result;img.onload=render};reader.readAsDataURL(file)}
    function resizePreview(){const shell=$('posterShell'),scale=shell.clientWidth/1080;$('poster').style.transform=`scale(${scale})`;shell.style.height=(1440*scale)+'px'}
    function waitImage(img){return img.complete&&img.naturalWidth?Promise.resolve():new Promise((ok,bad)=>{img.onload=ok;img.onerror=bad})}
    function drawCover(ctx,img,x,y,w,h,fx,fy){const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;const dx=x+(w-dw)*(fx/100),dy=y+(h-dh)*(fy/100);ctx.drawImage(img,dx,dy,dw,dh)}
    function drawLines(ctx,lines,x,y,size,lineHeight,weight){ctx.font=`${weight} ${size}px MontserratOZ, Montserrat, sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='#fff';lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight))}
    async function exportPng(){
      $('downloadButton').disabled=true;$('downloadButton').textContent='Membuat PNG…';
      try{
        await document.fonts.ready;const imgs=[$('photo'),$('logoTop'),$('category'),$('logoBottom'),$('author')];await Promise.all(imgs.map(waitImage));
        const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;const ctx=canvas.getContext('2d');
        const redTop=1440-state.redHeight;drawCover(ctx,$('photo'),0,0,1080,redTop,state.focusX,state.focusY);
        ctx.drawImage($('logoTop'),50,48,253,35);const cat=$('category');ctx.drawImage(cat,1080-cat.naturalWidth,61,cat.naturalWidth,cat.naturalHeight);
        ctx.fillStyle='#d80101';ctx.fillRect(0,redTop,1080,state.redHeight);
        drawLines(ctx,state.headlineLines,540,redTop+28,state.headlineSize,state.headlineSize*1.04,900);
        const headlineHeight=state.headlineLines.length*state.headlineSize*1.04;drawLines(ctx,state.subLines,540,redTop+28+headlineHeight+16,state.subSize,state.subSize*1.22,500);
        ctx.drawImage($('logoBottom'),50,1440-27-87,77,87);const a=$('author');ctx.drawImage(a,1080-48-a.naturalWidth,1440-31-a.naturalHeight,a.naturalWidth,a.naturalHeight);
        const link=document.createElement('a');link.download='otomotifzone-feed.png';link.href=canvas.toDataURL('image/png');link.click();
        $('status').className='status';$('status').textContent='PNG 1080 × 1440 berhasil dibuat.';
      }catch(e){$('status').className='status warn';$('status').textContent='Ekspor gagal: '+e.message}finally{$('downloadButton').disabled=false;$('downloadButton').textContent='Ekspor PNG 1080 × 1440'}
    }
    $('headlineInput').addEventListener('input',render);$('subInput').addEventListener('input',render);
    $('focusX').addEventListener('input',e=>{state.focusX=+e.target.value;render()});$('focusY').addEventListener('input',e=>{state.focusY=+e.target.value;render()});
    $('photoInput').addEventListener('change',()=>useUpload($('photoInput'),$('photo')));$('categoryInput').addEventListener('change',()=>useUpload($('categoryInput'),$('category')));$('authorInput').addEventListener('change',()=>useUpload($('authorInput'),$('author')));
    $('downloadButton').addEventListener('click',exportPng);$('resetButton').addEventListener('click',()=>{ $('headlineInput').value=defaults.headline;$('subInput').value=defaults.sub;$('photo').src=defaults.photo;$('category').src=defaults.category;$('author').src=defaults.author;state.focusX=state.focusY=50;$('focusX').value=$('focusY').value=50;render()});
    new ResizeObserver(resizePreview).observe($('posterShell'));window.addEventListener('load',async()=>{await document.fonts.ready;resizePreview();render()});
  </script>
</body>
</html>
